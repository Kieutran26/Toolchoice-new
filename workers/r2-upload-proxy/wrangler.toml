name = "toolchoice-r2-upload-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "toolchoice-assets"

[vars]
# Public base URL for the R2 bucket (custom domain or *.r2.dev).
PUBLIC_URL = "https://pub-1bcef6e2a41541759b3b023a0c59fd5e.r2.dev"
# Origin allowed to call this Worker (set to the site's real origin in prod).
CORS_ALLOW_ORIGIN = "https://toolchoice.site"
MAX_UPLOAD_BYTES = "10485760"

# Secret, set via CLI (never commit it):
#   wrangler secret put UPLOAD_TOKEN
