name = "toolchoice-admin-api"
main = "src/index.js"
compatibility_date = "2026-10-05"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "toolchoice-assets"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://toolchoice.site,https://www.toolchoice.site,http://localhost:3000,http://127.0.0.1:3000"
SUPABASE_URL = "https://rwphopolciuwrmmzztpm.supabase.co"
PUBLIC_URL = "https://pub-1bcef6e2a41541759b3b023a0c59fd5e.r2.dev"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
SITE_URL = "https://www.toolchoice.site"

