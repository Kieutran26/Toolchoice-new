name: Send Weekly 8-Tools Newsletter

on:
  schedule:
    # Chạy tự động vào 08:00 sáng Thứ Hai hàng tuần theo giờ Việt Nam (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch: # Cho phép bấm nút chạy thử nghiệm thủ công bất kỳ lúc nào trên GitHub

jobs:
  send-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chạy script gửi 8 công cụ tuần
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL || 'Toolchoice <newsletter@toolchoice.site>' }}
          NEWSLETTER_SINCE_DATE: ${{ secrets.NEWSLETTER_SINCE_DATE || '2026-10-01T00:00:00.000Z' }}
        run: node scripts/send-weekly-newsletter.mjs
